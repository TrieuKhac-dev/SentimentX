# Config RIÊNG của một thí nghiệm. Đây là lớp CUỐI khi hợp nhất, nên nó đè được mọi lớp trước
# (model, repo, task, evaluation, training, tracking). Xem docs/05_config/06_experiment.md.
#
# Chỉ khai những gì KHÁC mặc định dùng chung. Khai lại một giá trị y hệt mặc định là che mất
# nguồn sự thật: người đọc sau không biết sửa file nào mới đúng.

exp_id: exp008

# Thí nghiệm này làm lại từ thí nghiệm nào (đường dẫn đầy đủ `<model>/<method>/<expNNN>`),
# null nếu là bản gốc. Dùng khi cần đối chiếu với một lần chạy trước.
parent: visobert/lora/exp005

model: visobert
method: lora

# Mô tả ngắn thí nghiệm này khác gì các thí nghiệm khác.
notes: "tach tu bang pyvi - tach tu bang pyvi"

data:
  dataset: cosmetics
  # v0.2.0 là phiên bản dữ liệu ĐANG DÙNG (bản v0.1.0 là bản cũ, giữ làm dấu vết).
  version: v0.2.0

  # Bắt buộc khai, KHÔNG kế thừa: mỗi vai dùng split nào của chính dataset đó.
  # `eval: test` để số SO ĐƯỢC với công bố; `val` để chọn `model/best`.
  roles: {train: train, val: val, eval: test}

# Không có `prompt`: model encoder học từ dữ liệu gán nhãn, không nhận prompt.
# Bật huấn luyện (lớp dùng chung để `enabled: false`).
enabled: true

# ĐÚNG MỘT BIẾN so với `exp002`: CƠ CHẾ HỌC của đầu phân loại.
# `head.trainable: true` = đầu phân loại HỌC cùng adapter, dùng CHUNG `lr` với LoRA (cố ý không có
# `lr` riêng: một biến mỗi thí nghiệm). Ở mặc định `false`, `peft` đóng băng mọi tham số không phải
# adapter nên đầu phân loại chỉ là một phép chiếu NGẪU NHIÊN CỐ ĐỊNH: `head.pt` của bốn lượt LoRA đã
# chạy giống nhau TỪNG BYTE - đó là SỐ ĐO, không phải suy đoán (src/training/lora.py).
# Dấu vết để kiểm trong `metrics.json`: `trainable_params` phải LỚN HƠN lượt đóng băng đúng bằng số
# tham số của đầu phân loại = 7 khía cạnh × (768 ẩn × 3 mã + 3) = 16.149.
head:
  trainable: true

# Cùng công thức với `exp002` (và cũng là công thức của bốn lượt LoRA đã chạy): `weighted_ce` +
# `class_weight: inverse`; giữ nguyên để phép so chỉ còn MỘT biến. Đọc kết quả theo CẶP chỉ số: F1
# lớp âm VÀ phát hiện khía cạnh (ViSoBERT là model phát hiện khía cạnh tốt nhất bảng cũ), KHÔNG chỉ
# accuracy.
loss:
  type: weighted_ce
  class_weight: inverse

# Không có `requires_extra`: ViSoBERT đọc nguyên bản (`segmenter: none`), không cần Java hay model
# tách từ ngoài git.

preprocess:
  segmenter: pyvi


# --- Đ2: TIỀN XỬ LÝ ---------------------------------------------------------
# Lượt này KHÁC cha ĐÚNG MỘT khoá ĐO ĐƯỢC, phần còn lại y hệt cha (cùng seed, cùng hàm mất mát,
# cùng tham số LoRA, cùng số epoch). Biến của lượt này: `preprocess.segmenter` = pyvi
# Cha: visobert/lora/exp005
#
# Khoá `preprocess.segmenter` đổi thành `pyvi`: bộ tách từ quyết định văn bản đưa vào
# tokenizer. Số token trên mỗi review vì thế đổi, nên phép so này nói lên "tiền xử lý có
# đáng công không", không chỉ "bộ tách từ nào tốt hơn". Bộ tách từ phải có trong
# requirements-colab.txt: ô bootstrap tự cài khi cấu hình ĐÃ HỢP NHẤT khai bộ đó.
#
# ĐỌC SỐ THẾ NÀO: đọc theo CẶP chỉ số - F1 lớp âm + macro-F1 + số ô - KHÔNG chỉ accuracy (một phép
# đổi tiền xử lý có thể đổi cả hai chiều, xem docs/04_experiments/metrics.md). Mỗi nhánh chỉ có MỘT
# lượt nên chênh lệch nhỏ là CHƯA kết luận được: biên nhiễu của encoder đã đo được là +-0,33...+-0,67
# điểm (ba lượt chạy lại cha với decoding.seed 7).
