# Config RIÊNG của một thí nghiệm. Đây là lớp CUỐI khi hợp nhất, nên nó đè được mọi lớp trước
# (model, repo, task, evaluation, training, tracking). Xem docs/05_config/06_experiment.md.
#
# Chỉ khai những gì KHÁC mặc định dùng chung. Khai lại một giá trị y hệt mặc định là che mất
# nguồn sự thật: người đọc sau không biết sửa file nào mới đúng.

exp_id: exp003

# Thí nghiệm này làm lại từ thí nghiệm nào (đường dẫn đầy đủ `<model>/<method>/<expNNN>`),
# null nếu là bản gốc. Dùng khi cần đối chiếu với một lần chạy trước.
parent: cafebert/lora/exp001

model: cafebert
method: lora

notes: "THUOC NHIEU: chay lai exp001 voi decoding.seed 7 (dau phan loai van DONG BANG)"

data:
  dataset: cosmetics
  # v0.2.0 là phiên bản dữ liệu ĐANG DÙNG (bản v0.1.0 là bản cũ, giữ làm dấu vết).
  version: v0.2.0

  roles: {train: train, val: val, eval: test}

# Không có `prompt`: model encoder học từ dữ liệu gán nhãn, không nhận prompt.
enabled: true

# ĐÚNG MỘT BIẾN so với `exp001`: HẠT GIỐNG HUẤN LUYỆN (khoá `decoding.seed`).
# Ở ĐƯỜNG ENCODER (luôn chạy `greedy`), khoá này KHÔNG phải hạt giống lấy mẫu mà là hạt giống huấn
# luyện: nó điều khiển khởi tạo trọng số đầu phân loại, dropout và xáo trộn dữ liệu - xem dòng
# "NGOẠI LỆ Ở ĐƯỜNG ENCODER" trong `configs/experiments/evaluation.yaml`. Mặc định là 42 (đúng bằng
# các lượt cũ); lượt này khai 7 nên hạt giống ĐỔI và kết quả rơi vào thư mục MỚI.
# Đây là THƯỚC NHIỄU, KHÔNG phải lượt lấy điểm cao: mục đích là ĐO xem chênh lệch do hạt giống là bao
# nhiêu điểm, để biết các chênh lệch nhỏ ở nhóm đầu phân loại (bảng §2b của
# docs/04_experiments/08_experiment_rationale.md) có nằm NGOÀI biên nhiễu hay không.
decoding:
  seed: 7

# Y hệt `exp001`: `weighted_ce` + `class_weight: inverse` - hướng DUY NHẤT đã chứng minh có tác dụng
# với lớp âm. Giữ nguyên để phép so chỉ còn MỘT biến.
loss:
  type: weighted_ce
  class_weight: inverse

# Không có `requires_extra`: CafeBERT đọc nguyên bản (`segmenter: none`).
