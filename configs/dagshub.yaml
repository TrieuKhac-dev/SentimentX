# Kết nối DagsHub. Xem docs/05_config/07_env.md.
#
# File này giữ phần HẠ TẦNG, KHÔNG chứa token. Token nằm ở Colab Secrets hoặc file `.env`
# (cả hai đều không được commit), tên biến do `token_env` dưới đây quyết định.

dagshub:
  owner: TrieuKhac-dev
  repo: SentimentX

  # Địa chỉ MLflow suy ra từ owner/repo, nên chỉ cần sửa hai dòng trên là đủ.
  mlflow_uri: "https://dagshub.com/{owner}/{repo}.mlflow"

  # TÊN biến môi trường chứa token, không phải token.
  token_env: DAGSHUB_TOKEN
