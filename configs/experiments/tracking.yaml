# Ghi nhận kết quả. Xem docs/05_config/05_experiments_shared.md.
# Địa chỉ máy chủ MLflow nằm ở configs/dagshub.yaml.

# mlflow, local_json hoặc none. Tên phải có trong registry TRACKERS.
tracker: mlflow

# Tên experiment trên máy chủ MLflow.
experiment: sentimentx-absa

# Nhãn của run trên DagsHub, không phải git tag. auto nghĩa là notebook tự lấy từ run_meta.
mlflow_tags:
  model: auto
  method: auto
  exp_id: auto
  dataset: auto
  version_id: auto
  split: auto
  repo_sha: auto
  config_sha256: auto

# File nhỏ được tải lên. KHÔNG tải checkpoint và predictions.csv.
# CẢ HAI cơ sở đo đều lên: số của cơ sở `paper` nằm trong `metrics.json` (khoá `scores_paper`), còn
# danh sách ô đoán sai của cơ sở đó là một file nhẹ riêng. Cơ sở `paper` không có file nặng nào thêm.
artifacts:
  - run_meta.json
  - metrics.json
  - metrics.csv
  - run.log
  - training_history.csv
  - mispredictions.csv
  - mispredictions_paper.csv
  - model_input.csv
  - plots/accuracy.html
