# Cách chấm điểm. Xem docs/05_config/05_experiments_shared.md và docs/04_experiments/metrics.md.

# Số mẫu dùng để chấm. null nghĩa là toàn bộ split, và đó là cách dùng để so với công bố.
n: null

# Cửa CHẤT LƯỢNG cho khả năng đọc kết quả: lượt chạy có `% đọc được` thấp hơn ngưỡng này (đơn vị: %)
# bị gắn cờ `read_rate.valid = false` kèm `read_rate.reason` trong `metrics.json`.
# Cửa KHÔNG xoá dữ liệu - nó chỉ để người đọc biết con số đó KHÔNG dùng được. Đã gặp thật: ba lượt
# Qwen3-0.6B ngày 02/10/2026 chỉ đọc được 3,33 / 1,36 / 1,73% vì model bật suy nghĩ ăn hết trần token.
# Vì sao 95%: các lượt tốt đều >= 99,88%, còn lượt hỏng thì dưới 5% - cửa này tách hai nhóm đó.
read_rate_min: 95

# Cách sinh văn bản. greedy: chọn token xác suất cao nhất nên tất định.
# sample: lấy theo temperature và top_p.
#
# Hai giá trị dưới đây để null nghĩa là CHƯA KHAI: chạy ở chế độ sample thì dùng đúng khuyến nghị
# trong model card của Qwen3 (temperature 0.7, top_p 0.8, top_k 20 - `CARD_SETTINGS` trong
# src/experiments/experiment_run.py). Khai số cụ thể ở đây là ĐÈ lên khuyến nghị đó, nên chỉ khai khi có lý do,
# và ghi lý do ngay cạnh.
decoding:
  mode: greedy
  temperature: null
  top_p: null

# Tên chỉ số cần tính. Mỗi tên phải có trong registry SCORERS, thiếu tên thì báo lỗi.
scores:
  - accuracy
  - aspect_detection
  - prf
  - aggregate
  - confusion

# Chỉ số chấm trên CƠ SỞ ĐO CỦA CÔNG BỐ (khoá `scores_paper` trong `metrics.json`): chỉ giữ ô mà
# CẢ nhãn đúng VÀ nhãn đoán là positive/negative, đúng cách công bố đếm. `aspect_detection` KHÔNG
# có mặt vì trên cơ sở này mọi ô còn lại đều "có nhắc tới", nên nó không còn gì để đo (bài cũng
# không có bảng số cho nó). Bỏ hẳn khoá này thì suy ra từ `scores` (mọi chỉ số trừ `aspect_detection`).
scores_paper:
  - accuracy
  - prf
  - aggregate

# Chiều phân rã bảng chỉ số.
group_by:
  - aspect
  - sentiment

# Ghi gì vào thư mục kết quả. predictions.csv và plots/ là phần nặng.
save:
  predictions: true
  plots: true
  confusion: true
