# Huấn luyện. Thí nghiệm chỉ prompt để enabled: false.
# Xem docs/05_config/05_experiments_shared.md.

enabled: false

# Cách huấn luyện khi `enabled: true`. Tên phải có trong registry TRAINERS (src/training/).
trainer: lora

# Khi enabled: true thì roles bắt buộc có train và val.
# `lora.target_modules` KHÔNG khai ở đây: tên module khác nhau theo kiến trúc, nên nó thuộc
# `configs/models/<model_id>.yaml` (Qwen3: q_proj/k_proj/..., PhoBERT và ViSoBERT: query/key/...).
lora:
  r: 16
  alpha: 32
  dropout: 0.05

lr: 0.0002
batch: 8
epochs: 3
grad_accum: 4
weight_decay: 0.01

# Chính sách lưu checkpoint. Tên nhóm là `checkpoints` (số nhiều) vì `checkpoint` (số ít) đã là
# tên model trên Hugging Face ở lớp configs/models/<model_id>.yaml - trùng tên thì lớp sau đè
# mất lớp trước mà không báo gì.
checkpoints:
  every_n_steps: 100
  # Giữ ít checkpoint để khỏi đầy Drive; cũ hơn thì xoá.
  keep_last_k: 2
  save_last: true
  save_best: true
  # Xoá ngay các checkpoint-* trung gian sau mỗi lần lưu.
  delete_intermediate: true
