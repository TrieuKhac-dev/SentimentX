# Huấn luyện. Thí nghiệm chỉ prompt để enabled: false.
# Xem docs/05_config/05_experiments_shared.md.

enabled: false

# Cách huấn luyện khi `enabled: true`. Tên phải có trong registry TRAINERS (src/training/).
trainer: lora

# Khi enabled: true thì roles bắt buộc có train và val.
# `lora.target_modules` KHÔNG khai ở đây: tên module khác nhau theo kiến trúc, nên nó thuộc
# `configs/models/<model_id>.yaml` (Qwen3: q_proj/k_proj/..., PhoBERT và ViSoBERT: query/key/...).
lora:
  r: 16
  alpha: 32
  dropout: 0.05

# Đầu phân loại của đường encoder - cơ chế HỌC, không phải siêu tham số.
# `false` = ĐÓNG BĂNG: chỉ adapter học, đầu phân loại là phép chiếu ngẫu nhiên cố định từ lúc khởi tạo.
# Đây là hành vi mặc định và là cơ chế của các lượt đã chạy, nên giữ nguyên để chúng còn là mốc so sánh.
# `true` = đầu phân loại HỌC cùng adapter, dùng CHUNG `lr` ở dưới (cố ý không có `lr` riêng: một biến
# mỗi thí nghiệm). Cặp lượt chỉ khác đúng khoá này là phép đo "đóng băng hay không" khác gì nhau.
# Xem docs/04_experiments/06_lora_encoder.md và src/training/lora.py.
head:
  trainable: false

lr: 0.0002
batch: 8
epochs: 3
grad_accum: 4
weight_decay: 0.01

# Chính sách lưu checkpoint. Đọc bởi `src/training/checkpoints.py` - KHÔNG phải bởi trainer - nên mọi
# cách huấn luyện dùng chung; trainer chỉ cung cấp cách ghi trọng số (`src/training/savers/`).
# Tên nhóm là `checkpoints` (số nhiều) vì `checkpoint` (số ít) đã là
# tên model trên Hugging Face ở lớp configs/models/<model_id>.yaml - trùng tên thì lớp sau đè
# mất lớp trước mà không báo gì.
checkpoints:
  every_n_steps: 100
  # Giữ ít checkpoint để khỏi đầy Drive; cũ hơn thì xoá.
  keep_last_k: 2
  save_last: true
  save_best: true
  # Xoá ngay các checkpoint-* trung gian sau mỗi lần lưu.
  delete_intermediate: true
  # Chỉ số để chọn `model/best` (và để dừng sớm): phải là một khoá trong kết quả `measure()` của
  # đường encoder. `sentiment_f1` = macro-F1 sắc thái - ổn định với dữ liệu MẤT CÂN BẰNG, khác
  # `accuracy_cell` (bị lớp trội chi phối). Xem docs/04_experiments/06_lora_encoder.md.
  best_metric: sentiment_f1

# Hàm mất mát. `ce` = cross-entropy thường. `weighted_ce` = nhân TRỌNG SỐ LỚP (chống mất cân bằng:
# lớp hiếm được đẩy trọng số lên). Xem docs/04_experiments/06_lora_encoder.md.
loss:
  type: ce
  # Chỉ dùng khi `type: weighted_ce`. `inverse` = trọng số nghịch đảo tần suất (chuẩn hoá để trung
  # bình bằng 1), tính trên các ô ĐƯỢC TÍNH của tập train.
  class_weight: none

# Dừng sớm khi chỉ số val không còn cải thiện (CHỈ đường huấn luyện encoder; prompt không train).
# `metric` dùng chính `checkpoints.best_metric` (một chỗ khai, không lặp).
early_stop:
  enabled: false
  # Số lần đo val liên tiếp không tăng quá `min_delta` thì dừng.
  patience: 5
  min_delta: 0.0
