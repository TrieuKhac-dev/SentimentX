# Phiên bản 2 của dataset cosmetics: dữ liệu gốc v0.1.0 đi qua pipeline v0.2.0.
#
# File này BẤT BIẾN. Nội dung của nó, cùng file pipeline và nội dung dữ liệu gốc, đi vào mã
# phiên bản dữ liệu, nên sửa tại chỗ là hai định nghĩa khác nhau mang cùng một nhãn và kết
# quả cũ không còn tra được. Muốn đổi thì tạo file mới.
# Xem docs/05_config/03_datasets.md.

schema_version: 1
name: cosmetics

# Nhãn phiên bản dataset, trùng tên file.
version: v0.2.0

# Nguồn đi vào dataset. Mỗi phần tử có `kind` riêng: raw hoặc dataset.
sources:
  - kind: raw
    name: cosmetics
    raw_version: v0.1.0

# Phiên bản pipeline dùng để tạo dataset này.
pipeline_version: v0.2.0

# Định dạng file nguồn; thêm định dạng mới thì thêm một loader trong src/loaders/.
format: csv

# Tên file trong thư mục dữ liệu gốc, đúng như khi nhận được.
splits:
  train: data_train.csv
  val: data_val.csv
  test: data_test.csv

# File gộp toàn bộ dữ liệu, dùng để đối chiếu.
full: full_data.csv

schema:
  # Cột chứa nội dung review trong file gốc.
  text:
    column: data
  # Dataset chưa có cột định danh; để null, dành chỗ khi nào có.
  id:
    column: null
  aspects:
    - stayingpower
    - texture
    - smell
    - price
    - colour
    - shipping
    - packing
  labels:
    - positive
    - negative
    - neutral
  # Cột có trong file gốc nhưng KHÔNG dùng: "others" chỉ có nhãn neutral và ô trống,
  # không mang tín hiệu phân loại cảm xúc.
  drop:
    - others
  keep: []

# Cách xử lý khi các nguồn có bộ khía cạnh khác nhau. Hiện chỉ có một nguồn.
aspect_policy: union

parent: v0.1.0
notes: >
  Bản thứ hai: dữ liệu gốc v0.1.0 đi qua pipeline v0.2.0, nên `test` không bị sửa và bằng đúng
  dữ liệu gốc (1.623 dòng) - so được với công bố tham chiếu.

# Chốt tập đánh giá để kết quả so được với công bố tham chiếu.
# Hai giá trị dưới đây là số ĐO ĐƯỢC của `test.csv`, chép từ lần chạy thử (mã ...-1f788ee7) trước
# khi chạy chính thức: file này bất biến sau khi dùng, nên phải điền trước rồi mới chạy, chứ không
# sửa lại sau. `sha256` là băm BYTE của file; `records_sha256` trong `eval_lock.json` là băm theo
# bản ghi (bỏ qua thứ tự/định dạng) và không khai ở đây.
# Lệch nghĩa là test đã bị thay đổi, không còn so được với công bố.
eval_lock:
  enforce: true
  test:
    file: test.csv
    sha256: af349bf51739884b545e277ac5e0f8492e6a59aaba2739cd9fcb171ed3beba38
    rows: 1623
