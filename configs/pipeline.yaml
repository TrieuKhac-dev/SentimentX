# =====================================================================
# CẤU HÌNH DATA PIPELINE
#
# Mọi thay đổi trong file này đều được ghi lại vào báo cáo pipeline,
# để có thể chứng minh preprocessing nào thực sự ảnh hưởng tới model.
#
# Quy ước: true = BẬT (có thực hiện biến đổi), false = TẮT (giữ nguyên).
# =====================================================================

version: "0.1.0"

# ---------------------------------------------------------------------
# 2. VALIDATE — chỉ kiểm tra, KHÔNG sửa dữ liệu
# ---------------------------------------------------------------------
validate:
  # Kiểm tra schema: đủ cột, không thừa cột, đúng tên cột
  check_schema: true
  # Kiểm tra nội dung: review rỗng, nhãn nằm ngoài danh sách hợp lệ
  check_content: true

# ---------------------------------------------------------------------
# 3. CLEAN — thực sự loại bỏ / xử lý bản ghi
# ---------------------------------------------------------------------
clean:
  # Loại review rỗng hoặc chỉ có khoảng trắng
  remove_empty: true
  # Loại review là chuỗi ký tự vô nghĩa (ứng viên gibberish)
  remove_gibberish: true
  # Loại quảng cáo / tin nhắn nhà mạng
  remove_ads: true
  # Loại review chứa mã HTML / SQL / code (review bị dán từ nơi khác).
  # ĐANG BẬT: trên dữ liệu này nhóm này rất nhỏ (1 dòng/16.227 = 0,01%) và luật
  # đã được viết chặt để không bắt oan câu văn bình thường.
  remove_code: true

  deduplicate:
    # Loại trùng lặp chính xác (hai review giống hệt nhau)
    exact: true
    # Loại trùng lặp theo KHOÁ so trùng: bỏ dấu câu, bỏ hoa/thường, gộp khoảng
    # trắng. KHÔNG bỏ dấu tiếng Việt.
    normalized: true
    # Bỏ dấu tiếng Việt trong KHOÁ so trùng ("son dep" = "son đẹp").
    # GIỮ Ở false: dự án KHÔNG bỏ dấu tiếng Việt ở bất kỳ chỗ nào, kể cả trong
    # khoá so trùng. Hệ quả: "son dep" và "son đẹp" được coi là HAI review khác
    # nhau — đúng với thực tế dữ liệu, vì đó là hai cách viết khác nhau.
    ignore_diacritics: false
    # Phạm vi so trùng: "within_split" (trong từng split) hoặc "global"
    scope: within_split
    # Khi cùng một review nhưng nhãn KHÁC nhau:
    #   "quarantine"  -> đưa TẤT CẢ bản ghi đó ra khỏi tập, chờ xem xét tay
    #   "keep_first"  -> giữ bản ghi đầu tiên, bỏ các bản ghi sau
    conflict_policy: quarantine

  # Rò rỉ dữ liệu giữa các split (leakage).
  # EDA 05 cho thấy có review xuất hiện ở CẢ train và val/test. Nếu để nguyên,
  # điểm đánh giá model sẽ bị "đẹp giả tạo" vì model đã thấy trước dữ liệu.
  leakage:
    # Loại khỏi val/test những review đã xuất hiện trong train.
    # Giữ nguyên tập train để không mất dữ liệu học.
    remove_eval_overlap: true

# ---------------------------------------------------------------------
# 4. NORMALIZE — chuẩn hoá văn bản
# ---------------------------------------------------------------------
normalize:
  # Chuyển hết về chữ thường: "Son ĐẸP" -> "son đẹp".
  # MẶC ĐỊNH TẮT: 89,45% review có chữ hoa (phần lớn chỉ là chữ đầu câu) và
  # tokenizer subword của các model đều phân biệt hoa/thường, nên giữ nguyên
  # giúp model còn dùng được tín hiệu viết hoa. Bật để thực nghiệm.
  lowercase: false
  # Chuẩn hoá Unicode (NFC)
  unicode: true
  # Chuẩn hoá khoảng trắng và xuống dòng
  whitespace: true
  # Rút gọn ký tự lặp liên tiếp: "đẹppppp" -> "đẹpp"
  # MẶC ĐỊNH TẮT vì ký tự lặp mang thông tin cảm xúc. Bật để thực nghiệm.
  repeated_chars: false
  repeated_chars_max: 2
  # GHI CHÚ: bước này KHÔNG bỏ dấu tiếng Việt và KHÔNG thay teencode — văn bản
  # giữ nguyên như người viết, chỉ sửa hình thức. Dự án cũng không bỏ dấu tiếng
  # Việt ở bất kỳ chỗ nào khác (khoá so trùng đang để
  # clean.deduplicate.ignore_diacritics: false).

# ---------------------------------------------------------------------
# 5. TRANSFORM — chuyển sang dạng ABSA
# ---------------------------------------------------------------------
transform:
  # multi_head: 1 cột văn bản + một cột cho mỗi aspect, mỗi ô là mã nhãn (0/1/2/3)
  #
  # Pipeline chỉ xuất dạng này. Dạng JSONL cho model sinh (Qwen3 / ViTASA)
  # được sinh khi cần từ chính bảng multi_head, xem src/preprocessing/loader.py.
  format: multi_head
