# Cấu hình "MODEL ĐỌC DỮ LIỆU THẾ NÀO" của PhoBERT.
#
# max_length:
#   Ngưỡng cắt input, tính bằng TOKEN (kể cả 2 token đặc biệt <s> và </s>).
#   Đây là chỗ để THỬ NGHIỆM: sửa số ở đây rồi chạy lại, không phải sửa code.
#   - Trần kiến trúc của PhoBERT là 258 vị trí (`max_position_embeddings` trong
#     config.json của model); đặt cao hơn sẽ bị chặn ngay khi chạy.
#   - Chỉ có hiệu lực cho một lần chạy: giá trị đang dùng được in ra khi chạy, ghi vào
#     cột `max_length` của token_stats.csv, và nếu khác giá trị mặc định thì tên file CSV
#     có thêm `maxlen-...` để không ghi đè số liệu cũ.
#   - Giá trị mặc định (khi file này không ghi, hoặc bị xoá khoá) là MAX_LENGTH trong
#     src/preprocessing/phobert.py = 256. Xoá hẳn dòng dưới cũng là một cách quay về mặc định.
max_length: 256
