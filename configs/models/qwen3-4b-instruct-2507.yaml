# Cấu hình dùng chung của Qwen3-4B-Instruct-2507: mọi thứ không thuộc riêng một thí nghiệm.
# Prompt, examples, roles và dataset nằm trong config của thí nghiệm.
# Xem docs/05_config/04_models.md.

model_id: qwen3-4b-instruct-2507
checkpoint: Qwen/Qwen3-4B-Instruct-2507

# Tăng số này mỗi khi sửa file.
config_version: 2

preprocess:
  # Ngưỡng cắt input, tính bằng TOKEN (kể cả prompt). 2304 vì SỐ ĐO (25/09/2026): prompt CoT + 2 ví
  # dụ few-shot tốn 950 token/review, nhưng bản 5 ví dụ (`absa_cot_5shot_v1`, mức mà công bố so) tốn
  # 1.866 token/review trung bình và 2.109 token ở mẫu dài nhất. Ở ngưỡng 1280 thì 100% review của
  # CẢ BA split bị cắt mất phần đuôi - mà với prompt dạng chat, phần cuối chính là yêu cầu định dạng
  # đầu ra và object JSON mẫu, nên mọi mẫu mất luôn chỉ dẫn. Ở ngưỡng 1024 trước đây thì 4/12.302
  # mẫu train bị cắt. 2304 giữ 0% bị cắt ở mọi split cho cả hai mức ví dụ; trần của model là
  # 262.144 vị trí nên còn nhiều dư địa, và VRAM 6 GB vẫn đủ với lượng hoá 4-bit.
  max_length: 2304
  # Bắt buộc với Qwen3 ở chế độ chỉ dẫn: chèn lượt "assistant" rỗng để model bắt đầu sinh.
  add_generation_prompt: true

inference:
  dtype: bfloat16
  # Máy đang dùng có 6 GB VRAM nên phải lượng hoá 4-bit.
  quantization: 4bit
  batch_size: 8
