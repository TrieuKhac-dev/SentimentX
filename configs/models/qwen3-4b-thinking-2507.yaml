# Cấu hình dùng chung của Qwen3-4B-Thinking-2507: mọi thứ không thuộc riêng một thí nghiệm.
# Prompt, examples, roles và dataset nằm trong config của thí nghiệm.
# Xem docs/05_config/04_models.md.
#
# Vì sao có: câu hỏi "CHẾ ĐỘ của model có đổi kết quả không" - cùng CỠ và cùng họ với
# Qwen3-4B-Instruct-2507, chỉ khác model được huấn luyện để SUY NGHĨ trước khi trả lời.
# Đây là lượt trả lời trực tiếp bài học 0.6B (model bật suy nghĩ ăn hết trần token rồi
# không in JSON), nên phải đi kèm một lượt DÒ chốt trần.

model_id: qwen3-4b-thinking-2507
checkpoint: Qwen/Qwen3-4B-Thinking-2507

# Tăng số này mỗi khi sửa file.
config_version: 2

# prompt: model sinh (LLM) nhận prompt rồi trả lời. Đường chạy dùng `src/evaluation/runner.py`.
approach: prompt

preprocess:
  # Ngưỡng cắt input, tính bằng TOKEN (kể cả prompt). SỐ ĐO: cùng họ tokenizer với bản 4B, phần PROMPT giống hệt (phần suy nghĩ do model tự sinh).
  max_length: 2304
  # Bắt buộc với model chat ở chế độ prompt: chèn lượt "assistant" rỗng để model bắt đầu sinh.
  add_generation_prompt: true
  # KHÔNG khai `enable_thinking`: chat template của bản Thinking-2507 LUÔN suy nghĩ, không có công tắc.
  # Trần sinh vì thế phải do LƯỢT CHẠY khai (`decoding.max_new_tokens`) và phải có một lượt DÒ chốt số
  # - xem docs/04_experiments/metrics.md luật 3a. Cấu hình này cố ý không "tắt suy nghĩ" hộ.

inference:
  # `auto` = mã chọn theo máy: bf16 khi GPU hỗ trợ THẬT, fp16 khi không (T4), fp32 trên CPU.
  dtype: auto
  # Giống bản 4B: T4 có 6 GB VRAM.
  quantization: 4bit
  # LÔ NHỎ HƠN HẲN - SỐ HỌC, KHÔNG PHẢI CẢM TÍNH (sửa 10/10/2026 sau một lượt chạy thật đổ):
  # lượt DÒ `prompt-cot/exp001` khai trần 8.192 token, và bản Thinking-2507 tiêu hết trần đó. KV cache
  # của Qwen3-4B là 36 lớp × 8 đầu KV × 128 chiều × 2 (K,V) × 2 byte = 144 KB cho MỘT token của MỘT
  # chuỗi, nên lô 8 × (2.304 ngưỡng cắt + 8.192 trần) = 83.968 vị trí ≈ **11,5 GB** KV cache - cộng
  # trọng số và bộ nhớ đệm thì vượt 14,6 GB của T4, và `model.generate` thật đã chết bằng
  # `torch.OutOfMemoryError` giữa đường. Lô 2 ≈ **2,9 GB**, còn thừa chỗ cho trọng số 4-bit (~2,4 GB).
  # Vì sao KHÔNG chọn 4 (vẫn vừa, chạy nhanh gấp đôi): lượt DÒ không được chết GIỮA ĐƯỜNG - chết rồi
  # thì mất cả phiên GPU, còn chậm thì chỉ tốn thêm giờ. Bản 0.6B giữ lô 8 vì trần sinh của nó ngắn;
  # lô ở đây đi cùng TRẦN SINH của lượt chạy, nên hai thứ phải đọc cùng nhau (luật 23a,
  # docs/04_experiments/metrics.md). Đổi số này là một lượt chạy KHÁC (nằm trong mã băm danh tính).
  batch_size: 2
