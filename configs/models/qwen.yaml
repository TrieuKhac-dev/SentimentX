# Cấu hình "MODEL ĐỌC DỮ LIỆU THẾ NÀO" của Qwen3.
#
# File này KHÔNG nằm trong configs/pipeline.yaml là có chủ ý: nội dung
# pipeline.yaml được đưa vào hash để sinh MÃ PHIÊN BẢN DỮ LIỆU
# (src/versioning.py). Đổi prompt không làm đổi dữ liệu, nên để chung sẽ sinh ra
# những mã phiên bản mới vô nghĩa cho cùng một dataset.
#
# prompt:
#   Tên file prompt trong configs/prompts/ (không cần ghi đuôi .txt).
#   Muốn thử prompt khác: thêm một file .txt mới rồi đổi đúng dòng này, hoặc
#   chạy một lần với `python run_token_stats.py --prompt <tên>`.
#
# add_generation_prompt:
#   Chèn lượt "assistant" rỗng ở cuối hội thoại để model bắt đầu sinh — bắt buộc
#   với Qwen3 ở chế độ chỉ dẫn (Instruct).
#
# max_length:
#   Ngưỡng cắt input, tính bằng TOKEN (kể cả prompt). Đây là CẤU HÌNH ĐANG DÙNG của dự án
#   cho Qwen, nên con số ghi ở đây là con số đi vào mọi lần chạy/huấn luyện.
#   1280 vì SỐ ĐO: prompt CoT + 2 ví dụ few-shot tốn 861 token/review, review dài nhất
#   1.106 token, còn prompt một lượt chỉ 229 token. Ở ngưỡng 1024 thì đúng 4/12.302 mẫu
#   train bị cắt mất phần đuôi — mà với prompt dạng chat, phần cuối chính là yêu cầu định
#   dạng đầu ra, nên mẫu đó mất luôn chỉ dẫn. 1280 để 0% bị cắt ở mọi split, và không tốn
#   thêm gì đáng kể (chỉ những batch chứa mẫu dài mới dài hơn; trung bình/p95/p99 y hệt).
#   Giới hạn thật của model là 262.144 vị trí nên còn rất nhiều dư địa.
#   Giá trị mặc định trong code (khi file này không ghi khoá) là MAX_LENGTH trong
#   src/preprocessing/qwen.py = 1024.
max_length: 1280

prompt: qwen_absa_v1
add_generation_prompt: true

