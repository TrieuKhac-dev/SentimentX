# Cấu hình dùng chung của ViSoBERT. Xem docs/05_config/04_models.md.

model_id: visobert
checkpoint: uitnlp/visobert
config_version: 2

# prompt: model sinh (LLM) nhận câu chỉ dẫn rồi trả lời. encoder: model phân loại học từ dữ liệu
# gán nhãn. Giá trị này quyết định đường chạy: `encoder` dùng `src/encoder_run.py`.
approach: encoder

preprocess:
  # Ngưỡng cắt input, tính bằng TOKEN.
  # Trần kiến trúc của ViSoBERT là 514 vị trí (`max_position_embeddings` của model).
  # 256 là LỰA CHỌN CỦA DỰ ÁN, không phải giới hạn của model: review dài nhất trong dữ liệu
  # cosmetics là 229 token, và đặt cùng 256 với PhoBERT để hai model có cùng ngân sách input
  # (so sánh mới công bằng). Cách chọn số này: docs/04_experiments/02_model_input.md mục 5.
  max_length: 256
  # ViSoBERT đọc văn bản NGUYÊN BẢN (không tách từ); khai tường minh để cột truy vết của số liệu
  # nói rõ "không tách từ" là chủ ý, chứ không phải thiếu cấu hình.
  segmenter: none

# Chỉ thí nghiệm HUẤN LUYỆN mới dùng nhóm này; model sinh (Qwen3) không khai.
# Tham số huấn luyện dùng chung nằm ở `configs/experiments/training.yaml`; ở đây khai thứ RIÊNG
# của model, vì tên module khác nhau theo kiến trúc (Qwen3 dùng q_proj/k_proj, XLM-R dùng query/key).
lora:
  # Tên module trong `XLMRobertaLayer` (ViSoBERT dùng kiến trúc XLM-R).
  target_modules:
    - query
    - key
    - value
    - dense

inference:
  # `auto`: mã chọn kiểu số theo máy - bf16 khi máy hỗ trợ, fp16 khi không (T4 là Turing, không có
  # bf16), fp32 trên CPU. LoRA cơ bản (không lượng hoá) vẫn vừa 6 GB VRAM; muốn QLoRA thì khai
  # `quantization: 4bit` và cài bitsandbytes.
  dtype: auto
  batch_size: 16
