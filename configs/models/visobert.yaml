# Cấu hình dùng chung của ViSoBERT. Xem docs/05_config/04_models.md.

model_id: visobert
checkpoint: uitnlp/visobert
config_version: 1

preprocess:
  # Ngưỡng cắt input, tính bằng TOKEN.
  # Trần kiến trúc của ViSoBERT là 514 vị trí (`max_position_embeddings` của model).
  # 256 là LỰA CHỌN CỦA DỰ ÁN, không phải giới hạn của model: review dài nhất trong dữ liệu
  # cosmetics là 229 token, và đặt cùng 256 với PhoBERT để hai model có cùng ngân sách input
  # (so sánh mới công bằng). Cách chọn số này: docs/04_experiments/02_model_input.md mục 5.
  max_length: 256
