# Cấu hình ĐƯỜNG DẪN của dự án. Đây là nguồn duy nhất.
#
# Đổi cấu trúc thư mục thì sửa file này, không phải đi tìm từng chỗ viết cứng.
# Giới hạn: .gitignore và .gitattributes không đọc được YAML, nên vẫn phải sửa tay hai file đó.

version: 1

roots:
  data: data
  configs: configs
  experiments: experiments
  templates: templates
  docs: docs

# Giá trị ở đây tính TƯƠNG ĐỐI so với gốc của nhóm: nhóm `data` tính từ gốc dữ liệu,
# nhóm `configs` tính từ thư mục configs. Nhờ vậy ghi đè gốc bằng biến môi trường vẫn đúng.
data:
  raw: raw
  processed: processed
  models: models
  reports: reports
  assets: assets
  reference_publication: reference_publication

reports:
  dataset_registry: reports/dataset_registry
  experiment_registry: reports/experiment_registry
  attempt_registry: reports/attempt_registry
  model_input: reports/model_input
  metrics_matrix: reports/metrics_matrix

configs:
  datasets: datasets
  models: models
  prompts: prompts
  pipeline: pipeline
  experiment: experiments
  paths: paths.yaml
  dagshub: dagshub.yaml

# Mẫu tên thư mục và file kết quả. Đổi tên ở đây, không sửa code.
patterns:
  data_version: "{name}-ds{dataset_version}-pl{pipeline_version}-src{src}-{hash8}"
  run_log: "run.log"
  run_meta: "run_meta.json"
  metrics_json: "metrics.json"
  metrics_csv: "metrics.csv"
  errors: "errors.json"
  predictions: "predictions.csv"
  mispredictions: "mispredictions.csv"
  # Danh sách ô đoán sai theo CƠ SỞ ĐO của công bố (`paper`): chỉ ô mà cả nhãn đúng và nhãn đoán là
  # positive/negative. Tệp riêng chứ không thêm cột vào tệp trên, vì đây là hai tập ô khác nhau
  # (tệp này là TẬP CON của tệp trên) chứ không phải hai cách trình bày cùng một tập.
  mispredictions_paper: "mispredictions_paper.csv"
  model_input: "model_input.csv"
  # Số đo input thật của model (`run_token_stats.py`). Bảng tổng hợp nhóm `model_input` gom lại
  # theo hai mẫu tên này, nên đổi tên ở đây là đủ.
  token_stats: "token_stats.csv"
  token_stats_tagged: "token_stats__{tag}.csv"
  # Kho LỊCH SỬ bảng số đo: bảng của một bộ ví dụ/khối hệ thống KHÔNG còn tái lập được thì chuyển
  # vào đây (xem docs/04_experiments/02_model_input.md). Nằm NGOÀI `model_input/` nên bảng gộp không
  # quét tới; nội dung thư mục này không vào git.
  archive_dir: "_archive"
  plots: "plots"
  ckpt_last: "model/last"
  ckpt_best: "model/best"
  # Một ảnh chụp trung gian; `{step}` là số bước đã chạy. Nguồn duy nhất khai mẫu tên này.
  ckpt_snapshot: "model/checkpoint-{step}"
  pred_parts: "predictions/part_{n:04d}.jsonl"
  raw_meta: "raw_meta.yaml"
  experiment_config: "config.yaml"
  experiment_tmp: "_tmp"
  eda_dir: "eda"
  pipeline_dir: "pipeline"
  processing_log: "processing_log.json"
  label_map: "label_map.json"
  run_meta_dir: "results"
  # Khoá tập đánh giá, ghi một lần khi tạo dữ liệu: `data/processed/<mã>/eval_lock.json`.
  eval_lock: "eval_lock.json"
  # Số đo THÊM (rescore): tính lại từ `predictions.csv`, KHÔNG ghi đè số gốc. Xem docs/04_experiments/05_predictions.md.
  metrics_rescored_json: "metrics_rescored.json"
  metrics_rescored_csv: "metrics_rescored.csv"
  # Lịch sử huấn luyện của lượt chạy encoder: loss/metric theo epoch. Xem docs/04_experiments/06_lora_encoder.md.
  training_history: "training_history.csv"

colab:
  # Thử lần lượt khi mount Drive; {folder} là tên folder giảng viên cấp.
  drive_candidates:
    - "/content/drive/MyDrive/{folder}"
    - "/content/drive/Shareddrives/{folder}"
  folder_marker: ".sentimentx_root"
  env_file: "env/.env.colab"
  # Khi A CHIA SẺ thư mục nhóm cho b/c/d (thư mục nằm trong Drive của A, không phải Shared drive),
  # mỗi người bấm "Add shortcut to My Drive" MỘT lần. Drive để lối tắt trong thư mục ẩn này:
  # `/content/drive/MyDrive/.shortcut-targets-by-id/<id>/<tên thư mục>`. Notebook xét cả chỗ này,
  # vì nếu không thì b/c/d thấy "chưa có thư mục nhóm" dù họ đã được chia sẻ.
  shortcut_dir: ".shortcut-targets-by-id"

canonical:
  # Danh sách nào có thứ tự có nghĩa khi băm cấu hình.
  # Mặc định mọi danh sách đều được coi là tập hợp và được sắp xếp trước khi băm.
  ordered_lists: []
